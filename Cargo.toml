[workspace]
members = [
  "compiler-bin",
  "compiler-core/*",
  "compiler-lsp/*",
  "compiler-scripts",
  "docs/src/wasm",
  "tests-compatibility",
  "tests-integration",
]
default-members = [
  "compiler-core/*",
  "compiler-lsp/*",
]
resolver = "3"

[workspace.dependencies]
lsp-types = "=0.95.1"

[profile.dev.package.insta]
opt-level = 3
