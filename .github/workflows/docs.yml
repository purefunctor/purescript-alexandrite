name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: v2-docs-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/pnpm-lock.yaml') }}

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: "false"
          prefix-key: "v5-docs"

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: wasm-pack

      - name: Build WASM module
        run: cd docs && pnpm wasm

      - name: Install dependencies
        run: cd docs && pnpm install

      - name: Build documentation website
        run: cd docs && pnpm build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs/build/"

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
