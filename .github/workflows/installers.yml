name: Installer Tests

on:
  workflow_call:
    inputs:
      version:
        description: Release tag to install
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install, or latest
        default: latest
        required: true
        type: string

permissions:
  attestations: read
  contents: read

jobs:
  install:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require GitHub attestation verification
        shell: bash
        run: gh attestation verify --help >/dev/null

      - name: Install on Linux or macOS
        if: runner.os != 'Windows'
        env:
          IRIS_INSTALL_DIR: ${{ runner.temp }}/iris/bin
          IRIS_VERSION: ${{ inputs.version }}
        run: |
          sh ./install.sh
          "$IRIS_INSTALL_DIR/iris" --version
          test ! -e "$IRIS_INSTALL_DIR/purescript-analyzer"
          test ! -e "$IRIS_INSTALL_DIR/purescript-iris"

      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IRIS_INSTALL_DIR: ${{ runner.temp }}\iris\bin
          IRIS_VERSION: ${{ inputs.version }}
        run: |
          & ./install.ps1
          & "$env:IRIS_INSTALL_DIR\iris.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "iris --version failed" }
          foreach ($LegacyBinary in @("purescript-analyzer.exe", "purescript-iris.exe")) {
            if (Test-Path "$env:IRIS_INSTALL_DIR\$LegacyBinary") {
              throw "Installer created legacy executable $LegacyBinary"
            }
          }
